<div class="toast-container">
  @for (toast of toasts(); track toast.id) {
    <div class="toast" [class.exito]="toast.tipo === 'exito'" [class.error]="toast.tipo === 'error'">
      <span>{{ toast.mensaje }}</span>
      <button type="button" class="cerrar" (click)="cerrar(toast.id)" aria-label="Cerrar notificación">×</button>
    </div>
  }
</div>
