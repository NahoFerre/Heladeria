spring.application.name=HeladeriaBackend

# Red: escuchar en todas las interfaces para que llegue via Tailscale, no solo localhost
server.address=0.0.0.0
server.port=8081

# Base de datos dedicada (rol propio, no superusuario)
spring.datasource.url=jdbc:postgresql://localhost:5432/heladeria_db
spring.datasource.username=heladeria_app
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# El esquema lo maneja Flyway (migraciones versionadas), Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Fase 3 (Compras): estrategia para recalcular el costo unitario de insumos/productos al comprar.
# ULTIMO_COSTO sobrescribe con el costo de la compra; COSTO_PROMEDIO pondera por el stock existente.
app.compras.estrategia-costo=COSTO_PROMEDIO
